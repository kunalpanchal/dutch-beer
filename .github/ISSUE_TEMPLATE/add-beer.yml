name: Add a beer
description: Propose a new Dutch beer for the directory
title: "[Beer] "
labels: ["new-entry", "beer"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for documenting a beer. Include the brewery and a public source that a reviewer can check.
  - type: input
    id: name
    attributes:
      label: Beer name
      placeholder: e.g. Hel & Verdoemenis
    validations:
      required: true
  - type: input
    id: brewery
    attributes:
      label: Brewery
      placeholder: e.g. Brouwerij De Molen
    validations:
      required: true
  - type: input
    id: style
    attributes:
      label: Style
      placeholder: e.g. Imperial Stout
  - type: input
    id: abv
    attributes:
      label: ABV (%)
      placeholder: e.g. 10.0
  - type: dropdown
    id: availability
    attributes:
      label: Availability
      options:
        - Year-round
        - Seasonal
        - One-off
        - Unknown
  - type: input
    id: source
    attributes:
      label: Primary source URL
      description: Prefer the brewery’s own page for this beer. A label photo URL can also help.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Discontinued, seasonal window, contract-brewed, recipe change, or anything a reviewer should check.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This information is already public, and I am not copying copyrighted text.
          required: true
