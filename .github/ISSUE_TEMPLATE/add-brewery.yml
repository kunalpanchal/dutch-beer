name: Add a brewery
description: Propose a new Dutch brewery for the directory
title: "[Brewery] "
labels: ["new-entry", "brewery"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping build the Dutch beer record. Every listing needs a public primary source. Prefer the brewery’s own website.
  - type: input
    id: name
    attributes:
      label: Brewery name
      placeholder: e.g. Brouwerij De Molen
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official website
      placeholder: https://
    validations:
      required: true
  - type: input
    id: locality
    attributes:
      label: City or locality
      description: Where in the Netherlands is this brewery based?
      placeholder: e.g. Bodegraven
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Province or region
      placeholder: e.g. Zuid-Holland
  - type: input
    id: source
    attributes:
      label: Primary source URL
      description: A brewery page is best. A clear label photo URL can also help.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Closed, contract-brewed, taproom-only, or anything a reviewer should check.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This information is already public, and I am not copying copyrighted text.
          required: true
