name: Correct a listing
description: Report an inaccurate brewery or beer detail
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Corrections keep the directory trustworthy. Tell us what is wrong, what it should be, and how you know.
  - type: input
    id: entry
    attributes:
      label: Brewery or beer name
      placeholder: The listing that needs to change
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: Quote the current detail if you can, then the correction.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source URL
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra context
      description: Capture date, discontinued status, or why the current listing is misleading.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This information is already public, and I am not copying copyrighted text.
          required: true
